[build-system]
requires = ["setuptools>=77"]          # PEP 639 license-files
build-backend = "setuptools.build_meta"

[project]
name = "openstroke"
dynamic = ["version"]                   # single source: openstroke/__init__.py (__version__)
description = "OpenStroke: per-shape probabilities for the vector strokes of PDF drawings (raw output)"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]   # shipped in the wheel
# Core = pre-/post-processing only (CPU, no torch): payload geometry, shape attributes, HVAC object post-processing
# (hvac_faces + its scikit-learn face classifier). Model inference / training need the `torch` extra (or a torch the
# machine already has, as on Colab): the extract-duct worker installs the core only and calls the model endpoint.
dependencies = [
    "numpy",
    "scipy",
    "shapely>=2.0",
    "scikit-learn",        # hvac_faces.joblib face classifier
]

[project.optional-dependencies]
torch = [
    "torch",
    "torchvision",
    "matplotlib",
    "opencv-python>=4.6",  # openstroke.obb (version B)
    "pyyaml",              # openstroke.obb data.yaml
]
dev = ["pytest"]
app = ["streamlit", "psutil"]
baseline = ["scikit-learn"]

[project.scripts]
openstroke = "openstroke.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openstroke.__version__" }

[tool.setuptools.packages.find]
include = ["openstroke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
