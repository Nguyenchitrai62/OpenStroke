[build-system]
requires = ["setuptools>=77"]          # PEP 639 license-files
build-backend = "setuptools.build_meta"

[project]
name = "openstroke"
dynamic = ["version"]                   # single source: openstroke/__init__.py (__version__)
description = "OpenStroke: per-shape true/other classification of PDF vector strokes for MEP pipe networks"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]   # shipped in the wheel
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "shapely>=2.0",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit"]
baseline = ["scikit-learn"]

[project.scripts]
openstroke = "openstroke.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openstroke.__version__" }

[tool.setuptools.packages.find]
include = ["openstroke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
