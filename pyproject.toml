[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openstroke"
dynamic = ["version"]                   # single source: openstroke/__init__.py (__version__)
description = "OpenStroke: per-shape true/other classification of PDF vector strokes for MEP pipe networks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
openstroke = "openstroke.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openstroke.__version__" }

[tool.setuptools.packages.find]
include = ["openstroke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
